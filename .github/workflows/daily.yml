name: Daily builder inventory
on:
  schedule:
    # 10:00 am Florida (EDT). GitHub cron is UTC: 14:00 = 10am EDT / 9am EST.
    - cron: "0 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scrape Ocala
        run: node scripts/new-homes/sync.mjs --client=christina-martinez --cards-only --output=christina-martinez.json
      - name: Scrape Central Florida
        run: node scripts/new-homes/sync.mjs --client=central-florida --cards-only --output=central-florida.json
      - name: Scrape Tampa
        run: node scripts/new-homes/sync.mjs --client=tampa-pilot --cards-only --output=tampa.json
      - name: Scrape Lennar
        id: lennar
        continue-on-error: true
        run: node scripts/new-homes/sync-lennar.mjs
      - name: Build map inventory
        run: node scripts/new-homes/build-map.mjs
      - name: Publish JSON
        run: |
          git config user.name ezra
          git config user.email ezra@campo-os.local
          git add christina-martinez.json central-florida.json tampa.json lennar.json map-inventory.json
          if git diff --cached --quiet; then
            echo "no inventory change"
            exit 0
          fi
          git commit -m "daily builder inventory $(date -u +%F)"
          git push
      - name: Report a retained Lennar feed
        if: steps.lennar.outcome == 'failure'
        run: exit 1
